<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Spare</title>
<meta name="theme-color" content="#23324a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Spare">
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&family=Press+Start+2P&family=Nunito:wght@600;800;900&family=JetBrains+Mono:wght@400;600;800&family=Libre+Franklin:wght@500;700;800;900&family=Zen+Kaku+Gothic+New:wght@500;700;900&family=Public+Sans:wght@500;700;800;900&display=swap" rel="stylesheet">
<style>
/* VOICE: practical, quick, a tool used on a phone at the garage
   IDEA: the operator's paddle / open-work sheet
   PICTURE: the parsed list itself, each shift a paddle strip with big hanging times
   COLOUR and TYPE: paper white, bus-signage black, signal red accent, highlighter yellow; Barlow Condensed + Barlow
   LAYOUT: drop zone on top, filters, then the list of shift cards */
:root,:root[data-theme=dark]{color-scheme:light;
--bg:light-dark(#f4f3ef,#121314);--paper:light-dark(#fff,#1c1d1f);--ink:light-dark(#111,#eceae4);
--mute:light-dark(#5d5d5a,#a3a29d);--line:light-dark(#dcdad3,#33353a);--red:light-dark(#c8202a,#ff5a5f);
--hl:light-dark(#fff1a8,#4a4212);--chip:light-dark(#efede6,#26282c)}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Barlow,system-ui,sans-serif;overflow-x:clip}
.band{padding:clamp(20px,3vw,40px) max(4vw,14px);max-width:1100px;margin:0 auto}
header{background:var(--ink);color:var(--bg)}
header .band{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:12px;padding-block:22px}
h1{font:700 clamp(32px,6vw,48px)/1.05 "Barlow Condensed",sans-serif;margin:0}
h1 span{color:var(--red)}
header p{margin:0;color:color-mix(in srgb,var(--bg) 70%,transparent);font-size:15px}
.drop{border:2px dashed var(--line);background:var(--paper);border-radius:14px;padding:22px;display:grid;gap:10px;justify-items:center;text-align:center;transition:border-color .15s,background .15s}
.drop.over{border-color:var(--red);background:var(--hl)}
.drop b{font:600 22px/1.1 "Barlow Condensed",sans-serif}
.drop small{color:var(--mute)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
button,.btn{font:600 16px Barlow,sans-serif;min-height:44px;padding:0 18px;border-radius:10px;border:1.5px solid var(--ink);background:var(--ink);color:var(--bg);cursor:pointer}
button.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--red);outline-offset:2px}
button:disabled{opacity:.5;cursor:default}
input,select{font:16px Barlow,sans-serif;min-height:44px;padding:0 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--paper);color:var(--ink)}
.btns{display:flex;flex-wrap:nowrap;gap:clamp(4px,1.5vw,8px);width:100%}
.btns button{flex:1 1 auto;padding:0 clamp(8px,2.5vw,18px);white-space:nowrap;font-size:clamp(13px,3.6vw,16px)}
.thumbs{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.thumbs img{height:64px;border-radius:6px;border:1px solid var(--line)}
.status{min-height:24px;color:var(--mute);font-size:15px}
.status.err{color:var(--red)}
.sum{display:flex;flex-wrap:wrap;gap:8px 22px;margin:4px 0 14px;font-size:15px;color:var(--mute)}
.sum strong{font:700 24px/1 "Barlow Condensed",sans-serif;color:var(--ink);margin-right:4px}
.list{display:grid;gap:14px}
.shift{background:var(--paper);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.shift.pick{outline:3px solid var(--red)}
.sh{display:flex;flex-wrap:wrap;align-items:center;gap:6px 16px;padding:12px 16px;border-bottom:1px solid var(--line)}
.sh h2{font:700 26px/1 "Barlow Condensed",sans-serif;margin:0;white-space:nowrap}
.sh .meta{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--chip);border-radius:999px;padding:3px 10px;font-size:14px;white-space:nowrap}
.chip.hl{background:var(--hl);font-weight:600}
.chip.warn{background:var(--red);color:#fff}
.sh .sp{flex:1}
.sh button{min-height:36px;padding:0 12px;font-size:14px}
.pc{display:grid;grid-template-columns:5.2em minmax(0,1fr) 5.2em minmax(0,1fr) auto;gap:4px 12px;align-items:baseline;padding:10px 16px;border-top:1px dashed var(--line)}
.pc:first-of-type{border-top:0}
.t{font:700 26px/1 "Barlow Condensed",sans-serif;white-space:nowrap;font-variant-numeric:tabular-nums}
.t.off{color:var(--mute)}
.loc{font-size:15px}
.loc small{display:block;color:var(--mute);font-size:13px}
.pr{display:flex;gap:6px;flex-wrap:wrap;justify-content:end}
.sc{background:#ecdfcf;border:1px solid #d8c4ab;border-radius:14px;padding:10px;display:grid;gap:6px}
.sc{cursor:pointer;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;transition:background-color .2s,opacity .2s}
.sc:focus-visible{outline:3px solid var(--red);outline-offset:2px}
/* booked by someone else: dark, dim, thin diagonal slashes */
.sc.taken{background:#3a3d37 repeating-linear-gradient(135deg,rgba(255,255,255,.13) 0 1px,transparent 1px 10px);border-color:#2a2c28;color:#8d9188;opacity:.6}
.sc.taken .lc{background:#55584f;color:#b9bcb3}
.sc.taken .pd{background:#55584f;color:#b9bcb3}
.sc.taken .ptm{background:rgba(255,255,255,.08);color:#8d9188}
.sc.taken .tt i{color:#8d9188}
.sc.taken .segs{color:#8d9188}.sc.taken .segs span{border-left-color:#6b6e66}
.l1,.l2{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 14px}
.l1 .lc{font-size:17px;padding:2px 9px;border-radius:7px;background:#8e1328;color:#fff;white-space:normal;overflow-wrap:anywhere;font-weight:600}
.l1 .tt{font:700 21px/1 "Barlow Condensed",sans-serif;white-space:nowrap;font-variant-numeric:tabular-nums}
.l1 .tt i{font-style:normal;color:var(--red);padding:0 6px 0 0}
@media(min-width:601px){.l1 .tt i{margin-left:-8px}}
.l1 .hf{display:inline-flex;align-items:baseline;gap:4px 14px}
.l1{flex-wrap:nowrap;align-items:flex-start}.l1 .lw{flex:1 1 0;display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 14px}
@media(max-width:600px){.l1 .hf{flex:1 1 100%}}
.l1 .ptm{flex:none;margin-left:auto;padding:3px 9px;background:rgba(255,255,255,.55);border-radius:8px;font-size:13px;color:var(--mute);white-space:nowrap;text-align:right}
.l2 .pd{font-size:22px;background:#ffe27a;color:#6b3a00;border-radius:8px;padding:3px 10px}
.segs{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 0;color:var(--mute);font-variant-numeric:tabular-nums}
.segs span{white-space:nowrap;padding:0 10px;border-left:3px solid var(--red)}
.l2 button{margin-left:auto;min-height:36px;padding:0 10px;font-size:14px}
.runs{background:var(--paper);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.rh,.rr{display:grid;grid-template-columns:7.5em minmax(0,1fr) 6em 7.5em;gap:4px 14px;align-items:center;padding:10px 16px}
.rh{font-size:13px;color:var(--mute);font-weight:600;border-bottom:1px solid var(--line)}
.rr{border-top:1px dashed var(--line)}.rh+.rr{border-top:0}
.rr.pick{background:var(--hl)}
.pd{font:700 26px/1 "Barlow Condensed",sans-serif;white-space:nowrap}
.tm{font:700 26px/1 "Barlow Condensed",sans-serif;white-space:nowrap;font-variant-numeric:tabular-nums}
.tm i{font-style:normal;color:var(--red);padding:0 4px}
.tm small{display:block;font:400 13px/1.3 Barlow,sans-serif;color:var(--mute);white-space:normal;margin-top:4px}
.pl{font:600 22px/1 "Barlow Condensed",sans-serif;text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.rr button{min-height:36px;padding:0 10px;font-size:14px;justify-self:end}
@media(max-width:600px){.rh{display:none}.rr{grid-template-columns:auto minmax(0,1fr) auto}.rr .tm{grid-column:1/-1;grid-row:2}.pd,.tm{font-size:24px}}
.legend{margin-top:22px;padding-top:14px;border-top:1px solid var(--line);font-size:14px;color:var(--mute)}
.legend h3{margin:0 0 8px;font:600 16px Barlow,sans-serif;color:var(--ink)}
.legend dl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 14px;margin:0;align-items:center}
.legend dt{font-weight:600;color:var(--ink);white-space:nowrap}.legend dd{margin:0}
.lgpd{background:#ffe27a;color:#6b3a00;border-radius:6px;padding:1px 6px;font:700 14px "Barlow Condensed",sans-serif}
.lgbar{display:inline-block;width:3px;height:16px;background:var(--red);vertical-align:middle}
.lgtk{display:inline-block;width:36px;height:18px;border-radius:5px;vertical-align:middle;opacity:.6;background:#3a3d37 repeating-linear-gradient(135deg,rgba(255,255,255,.18) 0 1px,transparent 1px 6px)}
.themerow{margin-top:18px;display:flex;flex-wrap:wrap;justify-content:flex-end;align-items:center;gap:10px;font-weight:600}
.themerow select{min-width:170px;cursor:pointer}
.themerow label[for=themeSel]{margin-left:8px}
.empty{padding:40px 16px;text-align:center;color:var(--mute);background:var(--paper);border-radius:14px;border:1px solid var(--line)}
.note{font-size:13px;color:var(--mute);margin-top:18px}
details{margin-top:14px;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:10px 14px}
summary{cursor:pointer;font-weight:600;min-height:28px}
textarea{width:100%;min-height:140px;font:13px/1.4 ui-monospace,monospace;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);padding:8px}
@media(max-width:600px){
 .pc{grid-template-columns:4.4em minmax(0,1fr);row-gap:6px}
 .pc .pr{grid-column:1/-1;justify-content:start}
 .t{font-size:24px}
}
@media(prefers-reduced-motion:no-preference){.shift{animation:in .25s ease both}@keyframes in{from{opacity:0;transform:translateY(6px)}}}

/* ===== Pixel quest theme (html.pixel): retro handheld game, dialog-box cards, candy colours ===== */
:root.pixel,:root.pixel[data-theme]{color-scheme:light;--bg:#bfe9ff;--paper:#fff;--ink:#1d1b2e;--mute:#4b4868;--line:#1d1b2e;--red:#ff5d73;--hl:#ffd93d;--chip:#fff}
:root.pixel body{font-family:Nunito,Barlow,sans-serif;font-weight:700;background:var(--bg)}
:root.pixel body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
 background:linear-gradient(transparent calc(100% - 56px),#7bd88f calc(100% - 56px),#7bd88f calc(100% - 44px),#4fb86a calc(100% - 44px)),
 radial-gradient(circle at 18% 14%,#fff 0 22px,transparent 23px),radial-gradient(circle at 23% 12%,#fff 0 28px,transparent 29px),radial-gradient(circle at 80% 22%,#fff 0 20px,transparent 21px),radial-gradient(circle at 85% 20%,#fff 0 26px,transparent 27px),
 conic-gradient(from 0deg at 1px 1px,rgba(29,27,46,.05) 90deg,transparent 0) 0 0/8px 8px,var(--bg)}
:root.pixel .drop{background:#fff;border:3px dashed var(--ink);border-radius:6px;box-shadow:5px 5px 0 var(--ink)}
:root.pixel .drop.over{background:#fff7c2}
:root.pixel .drop b{font:400 15px/1.5 "Press Start 2P",monospace;color:#6c5ce7}
:root.pixel button,:root.pixel .btn{font-family:Nunito,sans-serif;font-weight:900;border:3px solid var(--ink);border-radius:6px;background:#ff5d73;color:#fff;box-shadow:3px 3px 0 var(--ink)}
:root.pixel button:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
:root.pixel button.ghost{background:#fff;color:var(--ink)}
:root.pixel .sum strong{font:400 18px/1 "Press Start 2P",monospace;color:#6c5ce7}
:root.pixel .status{color:var(--mute)}
:root.pixel .sc{background:#fff;border:3px solid var(--ink);border-radius:8px;box-shadow:5px 5px 0 var(--ink);outline:3px solid #fff;outline-offset:-7px}
:root.pixel .l1 .lc{background:#2ec4b6;color:#fff;border:2px solid var(--ink);border-radius:5px;font-family:Nunito,sans-serif;font-weight:900;text-shadow:1px 1px 0 rgba(0,0,0,.25)}
:root.pixel .l1 .tt{font:400 16px/1.2 "Press Start 2P",monospace;color:var(--ink)}
:root.pixel .l1 .tt i{color:#ff5d73;font-family:Nunito,sans-serif;font-weight:900;font-size:22px}
:root.pixel .l1 .ptm{background:#efeaff;color:#4a3fb5;border:2px solid #6c5ce7;border-radius:5px;font-family:Nunito,sans-serif;font-weight:800}
:root.pixel .l2 .pd{font:400 16px/1.2 "Press Start 2P",monospace;background:#ffd93d;color:var(--ink);border:2px solid var(--ink);border-radius:5px;padding:6px 8px;box-shadow:2px 2px 0 var(--ink)}
:root.pixel .segs{color:var(--ink);font-family:Nunito,sans-serif;font-weight:800}
:root.pixel .segs span{border-left:4px solid #6c5ce7}
:root.pixel .sc.taken{background:#3c3a52 repeating-linear-gradient(135deg,rgba(255,255,255,.14) 0 2px,transparent 2px 10px);border-color:#2a283b;box-shadow:3px 3px 0 #2a283b;outline-color:transparent;opacity:.5}
:root.pixel .sc.taken .lc,:root.pixel .sc.taken .pd,:root.pixel .sc.taken .ptm{background:#5b5873;color:#c9c6dc;border-color:#2a283b;box-shadow:none;text-shadow:none}
:root.pixel .sc.taken .tt,:root.pixel .sc.taken .tt i,:root.pixel .sc.taken .segs{color:#c9c6dc}
:root.pixel .sc.taken .segs span{border-left-color:#77748f}
:root.pixel .legend{background:#fff;border:3px solid var(--ink);border-radius:8px;box-shadow:5px 5px 0 var(--ink);padding:14px 16px;color:var(--mute)}
:root.pixel .legend h3{font:400 13px/1.4 "Press Start 2P",monospace;color:#6c5ce7}
:root.pixel .legend dt{color:var(--ink)}
:root.pixel .lgpd{background:#ffd93d;color:var(--ink);border:2px solid var(--ink);font:400 10px/1.4 "Press Start 2P",monospace}
:root.pixel .lgbar{background:#6c5ce7;width:4px}
:root.pixel .lgtk{background:#3c3a52 repeating-linear-gradient(135deg,rgba(255,255,255,.2) 0 2px,transparent 2px 6px);border:2px solid #2a283b}
:root.pixel .empty{background:#fff;border:3px solid var(--ink);box-shadow:5px 5px 0 var(--ink);color:var(--mute)}
:root.pixel main{padding-bottom:80px}
:root.pixel select{border:3px solid var(--ink);border-radius:6px;background:#fff;color:var(--ink);font-family:Nunito,sans-serif;font-weight:900;box-shadow:3px 3px 0 var(--ink)}
@media(max-width:600px){:root.pixel .l1 .tt,:root.pixel .l2 .pd{font-size:14px}}

/* ===== Terminal theme (html.term): green phosphor on black, monospace, scanlines ===== */
:root.term,:root.term[data-theme]{color-scheme:dark;--bg:#030703;--paper:#061006;--ink:#b8ffc9;--mute:#2fbf5a;--line:#145a26;--red:#39ff6a;--hl:#39ff6a;--chip:#061006;--g:#39ff6a}
:root.term body{font-family:"JetBrains Mono",ui-monospace,monospace;font-weight:400;background:var(--bg);color:var(--ink)}
:root.term body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(80% 60% at 50% 30%,rgba(57,255,106,.07),transparent 70%),var(--bg)}
:root.term body::after{content:"";position:fixed;inset:0;z-index:50;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.22) 0 1px,transparent 1px 3px)}
:root.term ::selection{background:var(--g);color:#000}
:root.term .drop{background:#040b04;border:1px dashed var(--g);border-radius:0;box-shadow:0 0 0 1px #0a2a12 inset}
:root.term .drop.over{background:#0a2a12}
:root.term .drop b{font:600 17px/1.4 "JetBrains Mono",monospace;color:var(--g);text-shadow:0 0 6px rgba(57,255,106,.6)}
:root.term .drop b::before{content:"$ "}
:root.term .drop b::after{content:"_";margin-left:2px}
@media(prefers-reduced-motion:no-preference){:root.term .drop b::after{animation:blink 1s steps(1) infinite}@keyframes blink{50%{opacity:0}}}
:root.term .drop small{color:var(--mute)}
:root.term button,:root.term .btn{font-family:"JetBrains Mono",monospace;font-weight:800;border-radius:0;background:var(--g);color:#001a07;border:1px solid var(--g);box-shadow:0 0 10px rgba(57,255,106,.35);text-shadow:none}
:root.term button.ghost{background:transparent;color:var(--g);border-color:var(--g);box-shadow:none}
:root.term button:disabled{opacity:.35}
:root.term button:focus-visible,:root.term select:focus-visible,:root.term .sc:focus-visible{outline:1px dashed var(--g);outline-offset:3px}
:root.term .status{color:var(--mute)}
:root.term .status::before{content:"> "}
:root.term .sum{color:var(--mute)}
:root.term .sum strong{font:800 22px/1 "JetBrains Mono",monospace;color:var(--g);text-shadow:0 0 8px rgba(57,255,106,.55)}
:root.term .sc{background:#051005;border:1px solid var(--line);border-left:3px solid var(--g);border-radius:0;box-shadow:none}
:root.term .l1 .lc{background:transparent;color:#d4ff7a;border:0;padding:0;font-family:"JetBrains Mono",monospace;font-weight:800;text-shadow:0 0 6px rgba(212,255,122,.4)}
:root.term .l1 .lc::before{content:"[";color:var(--mute)}
:root.term .l1 .lc::after{content:"]";color:var(--mute)}
:root.term .l1 .tt{font:800 20px/1 "JetBrains Mono",monospace;color:#eaffef;text-shadow:0 0 6px rgba(57,255,106,.35)}
:root.term .l1 .tt i{color:var(--g)}
:root.term .l1 .ptm{background:transparent;color:var(--mute);border:1px solid var(--line);border-radius:0;font-family:"JetBrains Mono",monospace}
:root.term .l2 .pd{font:800 19px/1 "JetBrains Mono",monospace;background:var(--g);color:#001a07;border-radius:0;padding:4px 8px;box-shadow:0 0 12px rgba(57,255,106,.45)}
:root.term .segs{color:#8fe8a5;font-family:"JetBrains Mono",monospace;font-size:14px}
:root.term .segs span{border-left:1px solid var(--g)}
:root.term .sc.taken{background:#000 repeating-linear-gradient(135deg,rgba(57,255,106,.09) 0 1px,transparent 1px 9px);border-color:#0a1f0e;border-left-color:#0f3318;opacity:.35}
:root.term .sc.taken .lc,:root.term .sc.taken .tt,:root.term .sc.taken .tt i,:root.term .sc.taken .segs,:root.term .sc.taken .ptm{color:#2a6b38;text-shadow:none;border-color:#0f3318}
:root.term .sc.taken .pd{background:#0f3318;color:#2a6b38;box-shadow:none}
:root.term .sc.taken .segs span{border-left-color:#0f3318}
:root.term .empty{background:#040b04;border:1px dashed var(--line);border-radius:0;color:var(--mute)}
:root.term .legend{border-top:1px dashed var(--line);color:var(--mute)}
:root.term .legend h3{font-family:"JetBrains Mono",monospace;color:var(--g)}
:root.term .legend h3::before{content:"// "}
:root.term .legend dt{color:#d4ff7a;font-family:"JetBrains Mono",monospace}
:root.term .lgpd{background:var(--g);color:#001a07;border-radius:0;font-family:"JetBrains Mono",monospace}
:root.term .lgbar{background:var(--g);width:1px}
:root.term .lgtk{background:#000 repeating-linear-gradient(135deg,rgba(57,255,106,.3) 0 1px,transparent 1px 6px);border:1px solid #0f3318;border-radius:0}
:root.term .thumbs img{border-radius:0;border-color:var(--g)}
:root.term select{background:#040b04;color:var(--g);border:1px solid var(--g);border-radius:0;font-family:"JetBrains Mono",monospace;font-weight:600}
:root.term .themerow{color:var(--g)}

/* ===== London theme (html.ldn): overcast sky, skyline over the Thames, bus red, street-name plates ===== */
:root.ldn,:root.ldn[data-theme]{color-scheme:light;--bg:#dfe3e8;--paper:#fff;--ink:#1c2230;--mute:#59606e;--line:#c3c9d2;--red:#da291c;--hl:#da291c;--chip:#fff}

<body>
<main class="band">
 <label class="drop" id="drop" for="file">
  <b>Drop, paste or pick screenshots</b>
  <small>PNG or JPG of the work-available sheet. Several at once is fine. Ctrl/⌘ + V works too.</small>
  <input type="file" id="file" accept="image/*" multiple hidden>
  <div class="thumbs" id="thumbs"></div>
 </label>
 <div class="row" style="margin-top:12px">
  <div class="btns">
   <button id="go" disabled>Read images</button>
   <button class="ghost" id="clearImgs" disabled>Remove images</button>
   <button class="ghost" id="clearAll">Clear list</button>
  </div>
 </div>
 <p class="status" id="status" role="status"></p>
 <div class="sum" id="sum"></div>
 <div class="list" id="list"></div>


 <section class="legend" aria-label="Legend">
  <h3>Legend</h3>
  <dl>
   <dt>STL</dt><dd>St Laurent Garage</dd>
   <dt>MERV</dt><dd>Merivale Garage</dd>
   <dt>PINE</dt><dd>Pinecrest Garage</dd>
   <dt>INDY</dt><dd>Industrial Garage</dd>
   <dt><span class="lgpd">41-10</span></dt><dd>Paddle (block-run)</dd>
   <dt>41x3</dt><dd>Route 41, 3 trips in a row</dd>
   <dt><span class="lgbar"></span></dt><dd>New piece of work</dd>
   <dt>Extra</dt><dd>109 work</dd>
   <dt><span class="lgtk"></span></dt><dd>Booked by someone else or not wanted (tap a shift to toggle)</dd>
  </dl>
 </section>
 <div class="themerow"><label for="padSel">Paddles</label><select id="padSel"><option value="fall-daily">Fall 2026 · Weekday</option><option value="fall-sat">Fall 2026 · Saturday</option><option value="fall-sun">Fall 2026 · Sunday</option><option value="winter-daily">Winter 2027 · Weekday</option><option value="winter-sat">Winter 2027 · Saturday</option><option value="winter-sun">Winter 2027 · Sunday</option></select><label for="themeSel">Theme</label><select id="themeSel"><option value="ott">Ottawa</option><option value="pixel">Pixel quest</option><option value="term">Terminal</option><option value="classic">Classic</option><option value="ldn">London</option><option value="tyo">Tokyo</option></select></div>
</main>

<script>
{
const $=id=>document.getElementById(id);
const KEY='workAvail.v1';
let imgs=[];let shifts=[];let picked=new Set();

const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const toMin=t=>{if(t==null)return null;const m=String(t).match(/(\d{1,2})\s*[:h.]\s*(\d{2})/);return m?(+m[1])*60+(+m[2]):null};
const fmt=m=>m==null?'—':`${Math.floor(m/60)}:${String(m%60).padStart(2,'0')}`;
const dur=m=>m==null?'—':`${Math.floor(m/60)}h${String(m%60).padStart(2,'0')}`;

function stats(s){
 const ps=s.pieces||[];
 const ons=ps.map(p=>toMin(p.on_time)).filter(x=>x!=null);
 let offs=ps.map(p=>{let o=toMin(p.off_time),n=toMin(p.on_time);if(o!=null&&n!=null&&o<n)o+=1440;return o}).filter(x=>x!=null);
 const on=ons.length?Math.min(...ons):null, off=offs.length?Math.max(...offs):null;
 let plat=ps.reduce((a,p)=>{let v=toMin(p.plat_time);if(v==null){const o=toMin(p.off_time),n=toMin(p.on_time);if(o!=null&&n!=null)v=(o-n+1440)%1440}return a+(v||0)},0);
 const given=toMin(s.total_plat);if(given!=null)plat=given;
 return{on,off,plat,spread:on!=null&&off!=null?off-on:null};
}

let SET=null,WORKDATE=null;
function save(){try{localStorage.setItem(KEY,JSON.stringify({shifts,picked:[...picked],set:SET,workDate:WORKDATE}))}catch(e){}}
function load(){try{const d=JSON.parse(localStorage.getItem(KEY)||'null');if(d){shifts=d.shifts||[];picked=new Set((d.picked||[]).filter(x=>typeof x==='string'));SET=d.set||null;WORKDATE=d.workDate||null}}catch(e){}}

const paddleOf=p=>[p.block,p.run].filter(Boolean).join('-');
const platOf=p=>{let v=toMin(p.plat_time);if(v==null){const o=toMin(p.off_time),n=toMin(p.on_time);if(o!=null&&n!=null)v=(o-n+1440)%1440}return v};
const pkey=(a,b)=>String(a).localeCompare(String(b),undefined,{numeric:true});

const LOC=[[/^St\.?\s*L(aurent)?\.?(\s+(North|South))?\s+Gar\w*$/i,'STL'],[/^Merivale(\s+\w+)?\s+Gar\w*$/i,'MERV'],[/^Pinecre?st(\s+\w+)?\s+Gar\w*$/i,'PINE'],[/^Industrial(\s+\w+)?\s+Gar\w*$/i,'INDY'],[/^Lincoln\s+Fields(\s+St\w*)?$/i,'Lincoln Fields']];
const shortLoc=l=>{const s=String(l||'—').trim().replace(/\s+Stati?o?$/i,' Station');for(const[re,v]of LOC)if(re.test(s))return v;return s};
// a fixed colour per location: garages set, others picked from the name
const LCOL={STL:['#cfe0f7','#12365e'],MERV:['#e6d7f4','#43215f'],PINE:['#f6d6de','#5f1d2e'],INDY:['#eedfc8','#55360f']};
const LPAL=[['#d2ecef','#0f4a52'],['#dfe3f2','#2a3550'],['#f0dbeb','#55234a'],['#f5e3cf','#5a3410'],['#dcefdc','#1f4a24'],['#e9e4f7','#3b2d66']];
const locStyle=n=>{let c=LCOL[n];if(!c){let x=0;for(const ch of n)x=(x*31+ch.charCodeAt(0))>>>0;c=LPAL[x%LPAL.length]}return `--lb:${c[0]};--lf:${c[1]}`};
const lcTag=l=>{const n=shortLoc(l);return `<span class="lc">${esc(n)}</span>`};
const isComplex=l=>/st[\s.-]*laurent\s+complex/i.test(String(l||''));
// total plat as printed, e.g. "0930 (4)" -> minutes for sorting
const platMin=s=>{const m=String(s.total_plat||'').match(/(\d{1,2})[:h]?(\d{2})/);if(m)return(+m[1])*60+(+m[2]);return(s.pieces||[]).reduce((a,p)=>a+(platOf(p)||0),0)};

// Fall 2026 weekday paddles: {"040010":[[route,startMin,endMin],...]}
// All paddle sets from Run Lookup: {"fall-daily":{eff,day,runs:{"040010":[[route,startMin,endMin],...]}},...}
let ALL=null,PAD=null;
const SETNAME={'fall-daily':'Fall 2026 · Weekday','fall-sat':'Fall 2026 · Saturday','fall-sun':'Fall 2026 · Sunday','winter-daily':'Winter 2027 · Weekday','winter-sat':'Winter 2027 · Saturday','winter-sun':'Winter 2027 · Sunday'};
// pick the season and day type that were in effect on the work date
function setFor(date){
 if(!ALL||!date)return 'fall-daily';
 const dow=date.getDay(),kind=dow===0?'sun':dow===6?'sat':'daily';
 const w=ALL['winter-'+kind];return w&&date>=new Date(w.eff)?'winter-'+kind:'fall-'+kind;
}
function useSet(k){if(!ALL)return;SET=ALL[k]?k:'fall-daily';PAD=ALL[SET].runs;const s=$('padSel');if(s)s.value=SET;render()}
const padKey=p=>{const b=String(p.block||'').replace(/\D/g,''),r=String(p.run||'').replace(/\D/g,'');return b&&r?b.padStart(3,'0')+r.padStart(3,'0'):null};
// ["99","99","99","168","168"] -> "99x3, 168x2" (repeats in a row are counted)
function countRuns(rt){const g=[];for(const x of rt){const l=g[g.length-1];l&&l[0]===x?l[1]++:g.push([x,1])}return g.map(([x,n])=>n>1?`${esc(x)}<b class="x">x${n}</b>`:esc(x)).join(', ')}
function routesFor(p){
 const k=padKey(p),t=PAD&&k&&PAD[k];if(!t||!t.length)return null;
 let on=toMin(p.on_time),off=toMin(p.off_time);if(on==null||off==null)return null;
 if(on<t[0][1]-180)on+=1440;
 while(off<on)off+=1440;
 return t.filter(x=>x[1]<off&&x[2]>on).map(x=>x[0]);
}
fetch('paddles.json').then(r=>r.ok?r.json():null).then(j=>{if(!j)return;ALL=j;useSet(SET||setFor(WORKDATE?new Date(WORKDATE+'T12:00'):new Date()))}).catch(()=>{});

function render(){
 const q='';
 let rows=shifts.map((s,i)=>{const ps=s.pieces||[],first=ps[0]||{},last=ps[ps.length-1]||{};
  const work=ps.filter(p=>p.block||p.run);
  const pads=[...new Set(work.map(paddleOf))];
  let off=toMin(last.off_time),on=toMin(first.on_time);if(off!=null&&on!=null&&off<on)off+=1440;
  return{s,i,id:'s'+i,ps,first,last,work,pads,on,off,plat:platMin(s)}});
 const total=rows.length;
 if(q)rows=rows.filter(r=>(r.pads.join(' ')+' '+JSON.stringify(r.s)).toLowerCase().includes(q));
 const k='on';
 rows.sort((a,b)=>k==='paddle'?(pkey(a.pads[0]||'',b.pads[0]||'')||(a.on??1e9)-(b.on??1e9)):k==='plat'?(b.plat-a.plat):((a[k]??1e9)-(b[k]??1e9)));
 const open=rows.filter(r=>!picked.has(r.id)).length;
 $('sum').innerHTML=total?`<span><strong>${open}</strong>open</span><span><strong>${rows.length-open}</strong>booked / don't want</span><span style="margin-left:auto;font-size:14px">Tap a shift when it's booked or you don't want</span>`:'';
 $('list').innerHTML=rows.length?rows.map(r=>{const on=picked.has(r.id);
  const pt=r.s.total_plat?esc(String(r.s.total_plat).replace(/\s+/g,'')):fmt(r.plat);
  const segs=r.work.map(p=>{const bn=String(p.block||'').replace(/\D/g,'').replace(/^0+/,''),rn=String(p.run||'').replace(/\D/g,'').replace(/^0+/,'');if(bn==='109')return rn==='102'?'Employee shuttle':'Extra';const rt=routesFor(p);return rt&&rt.length?countRuns(rt):`${esc(p.on_time||'—')}–${esc(p.off_time||'—')}`});
  return `<article class="sc${on?' taken':''}" data-id="${r.id}" role="button" tabindex="0" aria-pressed="${on}">
   <div class="l1"><div class="lw"><span class="hf">${lcTag(r.first.on_location)}<span class="tt">${esc(r.first.on_time||'—')}</span></span><span class="hf"><span class="tt"><i>→</i>${esc(r.last.off_time||'—')}</span>${isComplex(r.last.off_location)&&isComplex(r.first.on_location)?'':lcTag(r.last.off_location)}</span></div><span class="ptm">Plat: ${pt}</span></div>
   <div class="l2"><span class="pd">${esc(r.pads.join(' / ')||'—')}</span><span class="segs">${segs.filter((x,j)=>!(j&&x===segs[j-1]&&(x==='Employee shuttle'||x==='Extra'))).map(x=>`<span>${x}</span>`).join('')}</span></div>
  </article>`}).join('')
 :`<div class="empty">${total?'Nothing matches that search.':'No work loaded yet. Drop a screenshot above.'}</div>`;
}

function setStatus(t,err){$('status').textContent=t;$('status').className='status'+(err?' err':'')}
function showThumbs(){
 $('thumbs').innerHTML=imgs.map(f=>`<img alt="" src="${URL.createObjectURL(f)}">`).join('');
 $('go').disabled=$('clearImgs').disabled=!imgs.length;
 if(imgs.length)setStatus(`${imgs.length} image${imgs.length>1?'s':''} ready. Press Read images.`);
}
function addFiles(fl){for(const f of fl)if(f.type.startsWith('image/'))imgs.push(f);showThumbs()}

$('file').addEventListener('change',e=>{addFiles(e.target.files);e.target.value=''});
const d=$('drop');
['dragenter','dragover'].forEach(ev=>d.addEventListener(ev,e=>{e.preventDefault();d.classList.add('over')}));
['dragleave','drop'].forEach(ev=>d.addEventListener(ev,e=>{e.preventDefault();d.classList.remove('over')}));
d.addEventListener('drop',e=>addFiles(e.dataTransfer.files));
document.addEventListener('paste',e=>{const fs=[...(e.clipboardData?.files||[])];if(fs.length)addFiles(fs)});
$('clearImgs').addEventListener('click',()=>{imgs=[];showThumbs();setStatus('')});

// ---- On-device reading (Tesseract, runs on this phone; works offline once cached) ----
const TESS_OPTS={workerPath:'https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/worker.min.js',corePath:'https://cdn.jsdelivr.net/npm/tesseract.js-core@5',langPath:new URL('./',location.href).href,gzip:true};
let workerP=null;
const getWorker=()=>workerP||(workerP=Tesseract.createWorker('eng',1,{...TESS_OPTS,logger:m=>{if(m.status==='recognizing text')setStatus(`Reading… ${Math.round(m.progress*100)}%`);else if(m.status&&m.progress<1)setStatus('Getting the reader ready…')}}).then(async w=>{await w.setParameters({tessedit_pageseg_mode:'6',preserve_interword_spaces:'1'});return w}));
// upscale small screenshots and convert to grey for cleaner reading
async function prep(file){
 const bmp=await createImageBitmap(file);const k=bmp.width<1600?Math.min(3,1600/bmp.width):1;
 const c=document.createElement('canvas');c.width=Math.round(bmp.width*k);c.height=Math.round(bmp.height*k);
 const x=c.getContext('2d');x.filter='grayscale(1) contrast(1.15)';x.drawImage(bmp,0,0,c.width,c.height);return c;
}
// Sheet rows look like: "308 St L South Garage 14:08 17:10 03:02 Blair Station 40 10"
// Group headers look like: "0930 (4)"  (total plat, number of pieces)
const T='(\\d{1,2}[:.]\\d{2})';
const ROW=new RegExp(`^(?:(\\d{2,4})\\s+)?(.+?)\\s+${T}\\s+${T}\\s+${T}\\s+(.+?)(?:\\s+(\\d{1,3})\\s+(\\d{1,3}))?\\s*$`);
const HEAD=/^\s*(\d{3,4})\s*\(\s*(\d+)\s*\)\s*$/;
function parseSheet(text){
 const out=[];let cur=null;
 for(let line of text.split(/\n/)){
  line=line.replace(/[|_]+/g,' ').replace(/\s+/g,' ').trim();if(!line)continue;
  const hd=line.match(HEAD);if(hd){cur={shift:null,total_plat:`${hd[1]} (${hd[2]})`,pieces:[]};out.push(cur);continue}
  const m=line.match(ROW);if(!m)continue;
  if(!cur){cur={shift:null,total_plat:null,pieces:[]};out.push(cur)}
  const fix=t=>t.replace('.',':');
  cur.shift=cur.shift||m[1]||null;
  cur.pieces.push({on_location:m[2].trim(),on_time:fix(m[3]),off_time:fix(m[4]),plat_time:fix(m[5]),off_location:m[6].trim(),block:m[7]||null,run:m[8]||null});
 }
 return out.filter(s=>s.pieces.length);
}
$('go').addEventListener('click',async()=>{
 if(!window.Tesseract){setStatus('The reader hasn\'t loaded. Open the page once while online so it can be saved for offline use.',true);return}
 $('go').disabled=true;setStatus('Getting the reader ready…');
 try{
  const w=await getWorker();let text='';
  for(let i=0;i<imgs.length;i++){setStatus(`Reading image ${i+1} of ${imgs.length}…`);const r=await w.recognize(await prep(imgs[i]));text+=r.data.text+'\n'}
  const got=parseSheet(text);
  if(!got.length){setStatus('Couldn\'t find any work in that image. Try a clearer screenshot of just the table.',true);return}
  const wd=text.match(/Work\s*Date\W*(\d{4})[\/-](\d{1,2})[\/-](\d{1,2})/i);
  WORKDATE=wd?`${wd[1]}-${wd[2].padStart(2,'0')}-${wd[3].padStart(2,'0')}`:null;
  SET=null;shifts=got;picked=new Set();useSet(setFor(WORKDATE?new Date(WORKDATE+'T12:00'):new Date()));save();render();
  const n=got.reduce((a,s)=>a+s.pieces.length,0);
  setStatus(`Read ${got.length} shifts, ${n} pieces${WORKDATE?' for '+WORKDATE:''}. Using ${SETNAME[SET]||'Fall 2026 · Weekday'} paddles.`);
  imgs=[];showThumbs();
 }catch(e){console.error(e);setStatus('Couldn\'t read that image. If you\'re offline, open the page once with internet first.',true)}
 finally{$('go').disabled=!imgs.length}
});

const toggle=(c,kb)=>{const i=c.dataset.id;picked.has(i)?picked.delete(i):picked.add(i);save();render();if(kb){const n=$('list').querySelector(`[data-id="${i}"]`);n&&n.focus({preventScroll:true})}};
$('list').addEventListener('click',e=>{const c=e.target.closest('.sc');if(c)toggle(c)});
$('list').addEventListener('keydown',e=>{const c=e.target.closest('.sc');if(c&&(e.key==='Enter'||e.key===' ')){e.preventDefault();toggle(c,1)}});
const THEMES=[['classic','Classic'],['pixel','Pixel quest'],['term','Terminal'],['ldn','London'],['tyo','Tokyo'],['ott','Ottawa']];
const setTheme=t=>{const r=document.documentElement;THEMES.forEach(([k])=>k!=='classic'&&r.classList.toggle(k,k===t));$('themeSel').value=t;try{localStorage.setItem('workAvail.theme',t)}catch(e){}};
$('themeSel').addEventListener('change',e=>setTheme(e.target.value));
{let t='ott';try{const s=localStorage.getItem('workAvail.theme');if(THEMES.some(x=>x[0]===s))t=s}catch(e){}setTheme(t)}
$('padSel').addEventListener('change',e=>{useSet(e.target.value);save()});
$('clearAll').addEventListener('click',()=>{shifts=[];picked=new Set();save();render();setStatus('List cleared.')});

load();render();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
}
</script>
</body>
